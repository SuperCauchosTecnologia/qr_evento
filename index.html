<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Pro - Supabase</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --p: #2563eb; --s: #16a34a; --err: #dc2626; --bg: #f3f4f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 15px; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .stats { display: flex; justify-content: space-around; margin: 15px 0; }
        .stat-num { display: block; font-size: 26px; font-weight: bold; color: var(--p); }
        #reader { width: 100%; max-width: 400px; margin: 0 auto; border-radius: 12px; overflow: hidden; background: #000; min-height: 250px; }
        .btn { border: none; padding: 18px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; margin-top: 10px; transition: 0.3s; }
        #btn-scan { background: var(--p); color: white; }
        #btn-validar { background: var(--s); color: white; display: none; }
        .info-res { display: none; margin-top: 15px; text-align: left; border-top: 3px solid #eee; padding-top: 15px; }
        .ya-ingreso { color: var(--err); font-weight: bold; background: #fee2e2; padding: 10px; border-radius: 8px; margin-top: 10px; display: block; border: 1px solid #f87171; }
        #debug-info { font-size: 11px; color: #999; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Acceso al Evento</h2>
        <div class="stats">
            <div>Llegaron <span id="txt-llegaron" class="stat-num">0</span></div>
            <div>Pendientes <span id="txt-pendientes" class="stat-num">0</span></div>
        </div>
        <button id="btn-scan" class="btn" onclick="iniciarCamara()">📷 ABRIR CÁMARA</button>
    </div>

    <div id="reader"></div>

    <div id="info-box" class="card info-res">
        <h3 id="u-nombre" style="margin:0; color: #111;"></h3>
        <p id="u-tipo" style="color:#666; margin: 5px 0 10px 0;"></p>
        <div id="msg-repetido"></div>
        <button id="btn-validar" class="btn" onclick="validarIngreso()">✅ CONFIRMAR ENTRADA</button>
    </div>

    <div id="debug-info">Cargando Supabase...</div>

    <script>
        const SUPABASE_URL = "https://hrcxyidcoarwnuosjihl.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhyY3h5aWRjb2Fyd251b3NqaWhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1NjA1NzcsImV4cCI6MjA4ODEzNjU3N30.xL3JGEcyMHeGdFpMhvjHCf5Z6ZS4GJUa_5r2JAhV888";
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let html5QrCode;
        let selectedUser = null;

        async function cargarDatos() {
            try {
                const { data, error } = await _supabase.from('asistencia').select('*');
                if (error) throw error;

                const llegaron = data.filter(r => r.entrada).length;
                const total = data.length;

                document.getElementById('txt-llegaron').innerText = llegaron;
                document.getElementById('txt-pendientes').innerText = (total - llegaron);
                document.getElementById('debug-info').innerText = `Sync OK. Invitados: ${total}`;
                return data;
            } catch (e) {
                document.getElementById('debug-info').innerText = "Error de conexión.";
                console.error(e);
            }
        }

        function iniciarCamara() {
            document.getElementById('btn-scan').style.display = 'none';
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" }, 
                { fps: 15, qrbox: 250 }, 
                onScanSuccess
            ).catch(err => alert("Error cámara: " + err));
            cargarDatos();
        }

        async function onScanSuccess(decodedText) {
            html5QrCode.pause(true);
            const idEscaneado = decodedText.trim();
            
            document.getElementById('debug-info').innerText = "Buscando: " + idEscaneado;

            const { data, error } = await _supabase
                .from('asistencia')
                .select('*')
                .eq('qr_id', idEscaneado)
                .maybeSingle();

            if (error || !data) {
                alert("ID NO ENCONTRADO: " + idEscaneado);
                reiniciar();
                return;
            }

            selectedUser = data;
            const infoBox = document.getElementById('info-box');
            const msgRepetido = document.getElementById('msg-repetido');
            const btnValidar = document.getElementById('btn-validar');

            infoBox.style.display = 'block';
            document.getElementById('u-nombre').innerText = data.nombre || "Invitado";
            document.getElementById('u-tipo').innerText = "Categoría: " + (data.tipo || "General");

            if (data.entrada) {
                msgRepetido.innerHTML = `<span class="ya-ingreso">⚠️ YA INGRESÓ<br><small>Hora: ${data.entrada}</small></span>`;
                btnValidar.style.display = 'none';
                setTimeout(reiniciar, 4000);
            } else {
                msgRepetido.innerHTML = "";
                btnValidar.style.display = 'block';
                btnValidar.disabled = false;
                btnValidar.innerText = "✅ CONFIRMAR ENTRADA";
            }
        }

        async function validarIngreso() {
            const btn = document.getElementById('btn-validar');
            btn.disabled = true;
            btn.innerText = "⏳ REGISTRANDO...";

            const ahora = new Date();
            const horaString = ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            try {
                const { error } = await _supabase
                    .from('asistencia')
                    .update({ entrada: horaString })
                    .eq('id', selectedUser.id);

                if (error) throw error;

                alert("¡Acceso concedido!");
                await cargarDatos();
                reiniciar();
            } catch (e) {
                alert("Error al guardar.");
                btn.disabled = false;
            }
        }

        function reiniciar() {
            document.getElementById('info-box').style.display = 'none';
            selectedUser = null;
            if (html5QrCode) html5QrCode.resume();
        }

        cargarDatos();
    </script>
</body>
</html>
