<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Real-Time</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f2f5; padding: 20px; }
        #reader { width: 100%; max-width: 400px; margin: auto; border-radius: 10px; overflow: hidden; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-top: 20px; display:none; }
        .btn { padding: 15px; width: 100%; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .msg { font-weight: bold; padding: 10px; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>Control de Acceso Real-Time</h2>
    <div id="reader"></div>
    <div id="info" class="card">
        <h3 id="nombre"></h3>
        <div id="resultado" class="msg"></div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwIYzk9vhfI8l9i2v9cYe2Zjq-k8T7KjbJ2XKz8ELfsH8DD_SJNWJXTQA46-TU0CpAZ/exec";
        const html5QrCode = new Html5Qrcode("reader");

        html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, onScanSuccess);

        async function onScanSuccess(decodedText) {
            html5QrCode.pause(true);
            document.getElementById('info').style.display = 'block';
            document.getElementById('nombre').innerText = "Validando...";
            document.getElementById('resultado').innerText = "Consultando base de datos...";

            try {
                const response = await fetch(`${SCRIPT_URL}?id=${decodedText.trim()}`);
                const res = await response.text();
                const [status, nombre, hora] = res.split('|');

                if (status === "EXITO") {
                    document.getElementById('nombre').innerText = "✅ " + nombre;
                    document.getElementById('resultado').innerText = "¡BIENVENIDO!";
                    document.getElementById('resultado').style.background = "#dcfce7";
                } else if (status === "YA_INGRESO") {
                    document.getElementById('nombre').innerText = "⚠️ " + nombre;
                    document.getElementById('resultado').innerText = "YA INGRESÓ A LAS " + hora;
                    document.getElementById('resultado').style.background = "#fee2e2";
                } else {
                    alert("ID NO ENCONTRADO");
                }
            } catch (e) {
                alert("Error de conexión");
            }
            
            setTimeout(() => {
                document.getElementById('info').style.display = 'none';
                html5QrCode.resume();
            }, 3000);
        }
    </script>
</body>
</html>
